<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartVend Admin</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#16181b;background:#f3f4f6;--line:#d9dde2;--soft:#f8f9fa;--accent:#f4512b;--muted:#697078}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1000px;margin:auto}.head,.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:18px}.head{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:#526477}h1{font-size:25px;margin:5px 0}h2{font-size:20px;margin:0}.muted{font-size:13px;color:var(--muted)}.status{padding:7px 10px;border:1px solid var(--line);border-radius:5px;font-size:12px;font-weight:800}.lock-card{background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:25px;text-align:center}.lock-card h2{margin-bottom:8px}.btn{background:var(--accent);border:0;color:white;padding:10px 14px;border-radius:5px;font-weight:800;cursor:pointer}.secondary{background:white;color:#16181b;border:1px solid var(--line)}.danger{color:#c83c2b}.row{display:flex;gap:8px;justify-content:center;margin-top:14px}.row input,.stock-input{padding:9px;border:1px solid var(--line);border-radius:5px}.hidden{display:none!important}.admin-row{display:grid;grid-template-columns:70px 1fr 130px auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.day-actions{display:flex;gap:8px;flex-wrap:wrap}.sales{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}.sales th,.sales td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;background:var(--soft);padding:14px;border-radius:5px}.error{color:#c83c2b;margin-top:10px}@media(max-width:600px){body{padding:12px}.head{align-items:flex-start}.admin-row{grid-template-columns:45px 1fr 75px auto}.row{flex-direction:column}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="eyebrow">SMARTVEND · ADMIN</div><h1>Administration</h1><div class="muted">Manage inventory and daily sales collection.</div></div><a class="btn secondary" href="/customer">Customer view</a></header>
<section class="panel"><div class="admin-top"><div><div class="eyebrow">ADMIN ACCESS</div><h2>Inventory & daily collection</h2></div><span class="status" id="badge">SIGNED OUT</span></div>
<div id="login" class="lock-card"><h2>Admin sign in</h2><div class="muted">Sign in to edit stock or collect daily sales.</div><div class="row"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button class="btn" id="loginBtn">Sign in</button></div><div id="error" class="error"></div></div>
<div id="controls" class="hidden"><div class="admin-top"><strong>Inventory</strong><button class="btn secondary danger" id="logoutBtn">Sign out</button></div><div id="inventory"></div>
<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="admin-top"><div><strong>Daily receipt collection</strong><div id="collectionInfo" class="muted"></div></div></div><div class="day-actions"><button class="btn" id="endDayBtn">Generate receipt & clear today's sales</button><button class="btn secondary" id="salesBtn">View today's sales</button></div><div id="feedback" class="muted" style="margin-top:12px"></div><pre id="receipt" class="hidden"></pre><div id="sales"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);async function api(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
function showError(message){$('error').textContent=message;$('feedback').textContent=message}
function renderInventory(items){$('inventory').innerHTML=items.map(item=>`<div class="admin-row"><strong>${item.slot}</strong><span>${item.name}<br><small>${item.stock} in stock</small></span><input class="stock-input" type="number" min="0" value="${item.stock}" id="stock-${item.slot}"><button class="btn" data-save="${item.slot}">Save</button></div>`).join('');document.querySelectorAll('[data-save]').forEach(button=>button.onclick=()=>saveStock(button.dataset.save))}
async function loadAdmin(){try{const [items,status]=await Promise.all([api('/api/inventory'),api('/api/access-status')]);if(!status.inventory_unlocked||!status.receipt_unlocked){$('login').classList.remove('hidden');$('controls').classList.add('hidden');$('badge').textContent='SIGNED OUT';return}$('login').classList.add('hidden');$('controls').classList.remove('hidden');$('badge').textContent='SIGNED IN';renderInventory(items.items);$('collectionInfo').textContent=`Collection #${status.receipt_count} · ${status.last_receipt_date?'Last collection: '+status.last_receipt_date:'No previous collection'}`}catch(error){showError(error.message)}}
async function signIn(){try{await api('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value,target:'both'})});$('password').value='';$('error').textContent='';await loadAdmin()}catch(error){showError(error.message)}}
async function saveStock(slot){try{const stock=Number($(`stock-${slot}`).value);await api('/api/inventory/set-stock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot,stock})});$('feedback').textContent=`${slot} stock saved.`;await loadAdmin()}catch(error){showError(error.message)}}
async function signOut(){try{await api('/api/lock',{method:'POST'});$('feedback').textContent='Signed out.';await loadAdmin()}catch(error){showError(error.message)}}
async function endDay(){try{const data=await api('/api/end-day',{method:'POST'});$('receipt').textContent=data.receipt.join('\n');$('receipt').classList.remove('hidden');$('feedback').textContent=`Receipt #${data.receipt_count} issued. ${data.transactions} transaction(s) collected.`;await loadAdmin()}catch(error){showError(error.message)}}
async function showSales(){try{const data=await api('/api/daily-sales');$('sales').innerHTML=data.sales.length?`<table class="sales"><tr><th>Time</th><th>Item</th><th>Price</th><th>Paid</th><th>Change</th></tr>${data.sales.map(row=>`<tr><td>${row.sale_time}</td><td>${row.item_name}</td><td>₹${row.price}</td><td>₹${row.paid}</td><td>₹${row.change_amount}</td></tr>`).join('')}</table>`:'<p class="muted">No sales stored for today.</p>'}catch(error){showError(error.message)}}
$('loginBtn').onclick=signIn;$('password').onkeydown=event=>{if(event.key==='Enter')signIn()};$('logoutBtn').onclick=signOut;$('endDayBtn').onclick=endDay;$('salesBtn').onclick=showSales;loadAdmin();
</script></body></html>
