<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartVend · Welcome</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#16181b;background:#f3f4f6;--line:#d9dde2;--muted:#697078;--accent:#f4512b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.welcome{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:12px;padding:38px;box-shadow:0 12px 32px rgba(20,25,30,.08);text-align:center}.mark{width:48px;height:48px;margin:0 auto 18px;display:grid;place-items:center;background:#181b1f;color:#fff;border-radius:8px;font-weight:800;font-size:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#697078}.welcome h1{font-size:32px;margin:8px 0}.welcome p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 24px}.customer{display:block;background:var(--accent);color:#fff;text-decoration:none;padding:14px 18px;border-radius:6px;font-size:16px;font-weight:800}.customer:hover{background:#d93d1c}.admin{display:inline-block;margin-top:16px;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}.admin:hover{color:#16181b}@media(max-width:480px){.welcome{padding:30px 22px}}
</style></head>
<body><main class="welcome"><div class="mark">SV</div><div class="eyebrow">SMARTVEND</div><h1>Welcome</h1><p>Choose how you want to continue.</p><a class="customer" href="/customer">Enter as a Customer</a><a class="admin" href="/admin">Admin login</a></main></body>
</html>
