services:
  - type: web
    name: smartvend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SMARTVEND_ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
